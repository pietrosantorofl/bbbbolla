  <style>
    .archivio { max-width: 1080px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) var(--gutter) 40px; }
    .archivio__titolo { margin: 0 0 clamp(24px, 4vw, 48px); font-size: clamp(44px, 9vw, 96px); line-height: .92; letter-spacing: -.05em; font-weight: 700; }
    .archivio__vuoto { font-size: 18px; color: var(--muted); }

    /* una serata: data e line-up, poi le locandine una accanto all'altra */
    .passata { border-top: 1.5px solid var(--ink); padding: clamp(20px, 3vw, 32px) 0 clamp(36px, 6vw, 72px); }
    .passata__data { margin: 0 0 clamp(16px, 3vw, 28px); font-size: clamp(28px, 4.5vw, 48px); line-height: 1; letter-spacing: -.03em; font-weight: 700; }
    .passata__locandine { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: clamp(10px, 2vw, 24px); }
    .passata__locandine a { display: block; border-radius: 4px; overflow: hidden; border: 1.5px solid var(--ink); background: #fff; }
    .passata__locandine img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .3s; }
    .passata__locandine a:hover img { transform: scale(1.02); }
    .passata__locandine a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .passata__vibes { margin: clamp(14px, 2vw, 20px) 0 0; font-size: 17px; font-weight: 600; }
    .passata__vibes a { text-underline-offset: 4px; }
  </style>
