<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bolla® — Ingresso</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bolla ingresso">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=202610230519">
  <style>
    body { background: var(--ink); color: var(--paper-2); min-height: 100svh; }
    body::after { display: none; }
    .staff { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    .staff__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .staff__logo { height: 28px; width: auto; filter: invert(1); }
    .staff__meta { font-size: 13px; opacity: .7; text-align: right; }
    .link { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; opacity: .8; }

    .login { display: grid; gap: 14px; margin-top: 12vh; }
    .login h1 { margin: 0; font-size: 32px; letter-spacing: -.03em; }
    .login p { margin: 0; opacity: .75; }
    .pin { width: 100%; min-height: 64px; border-radius: 16px; border: 0; padding: 0 18px; font: 600 30px/1 var(--font); letter-spacing: .3em; text-align: center; }
    .btn--light { --bg: var(--paper-2); color: var(--ink); }

    .counter { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .counter div { background: #1f1f1f; border-radius: 14px; padding: 10px 12px; }
    .counter strong { display: block; font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .counter span { font-size: 12px; opacity: .7; }

    .camera { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #000; }
    .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .camera__frame { position: absolute; inset: 18%; border: 3px solid rgba(255, 255, 255, .8); border-radius: 22px; pointer-events: none; }
    .camera__start { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
    .camera__hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px; opacity: .85; }

    .esito {
      position: fixed; inset: 0; z-index: 50; display: grid; align-content: center; gap: 10px;
      padding: 24px; text-align: center; color: #fff;
    }
    .esito--ok { background: #128a46; }
    .esito--no { background: #c4231b; }
    .esito--warn { background: #c27a00; }
    .esito--wait { background: #2b2f8e; }
    .esito__titolo { margin: 0; font-size: clamp(44px, 14vw, 72px); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .esito__nome { margin: 0; font-size: 28px; font-weight: 600; }
    .esito__info { margin: 0; font-size: 17px; opacity: .92; }
    .esito__gruppo { list-style: none; margin: 10px auto 0; padding: 12px 16px; display: grid; gap: 6px; text-align: left; background: rgba(0, 0, 0, .18); border-radius: 14px; min-width: 260px; }
    .esito__gruppo li { font-size: 17px; }
    .esito__chiudi { margin-top: 18px; justify-self: center; }

    .manual { display: grid; gap: 10px; margin-top: 14px; }
    .manual__row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .manual input { min-height: 52px; border-radius: 14px; border: 0; padding: 0 14px; font: 400 17px var(--font); }
    .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .results button {
      width: 100%; display: flex; justify-content: space-between; gap: 12px; align-items: center;
      background: #1f1f1f; color: inherit; border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; text-align: left; cursor: pointer;
    }
    .results small { opacity: .7; }
    .tag-dentro { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #128a46; white-space: nowrap; }
    .coda { margin-top: 10px; font-size: 13px; color: #ffcc66; }
    .errore { color: #ff8a80; margin: 0; }
  </style>
</head>
<body>
  <main class="staff">
    <div class="staff__top">
      <img class="staff__logo" src="assets/bolla-logo.png" alt="bolla®" width="808" height="312">
      <div class="staff__meta"><span data-ruolo="serata"></span><br><button type="button" class="link" data-azione="esci" hidden>Esci</button></div>
    </div>

    <!-- accesso -->
    <form class="login" id="login">
      <h1>Ingresso</h1>
      <p>Inserisci il PIN staff. Lo crei dal foglio: menu bolla® → Crea PIN staff.</p>
      <input class="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required aria-label="PIN staff">
      <p class="errore" role="alert" hidden></p>
      <button class="btn btn--light btn--block" type="submit">Entra</button>
    </form>

    <!-- app -->
    <section id="app" hidden>
      <div class="counter">
        <div><strong data-ruolo="entrati">0</strong><span>entrati</span></div>
        <div><strong data-ruolo="attesi">0</strong><span>pass attivi</span></div>
        <div><strong data-ruolo="capienza">–</strong><span>capienza</span></div>
      </div>

      <div class="camera">
        <video playsinline muted></video>
        <div class="camera__frame" hidden></div>
        <div class="camera__start"><button type="button" class="btn btn--light" data-azione="camera">Avvia fotocamera</button></div>
        <p class="camera__hint" hidden>Inquadra il QR del pass</p>
      </div>

      <div class="manual">
        <div class="manual__row">
          <input data-ruolo="cerca" placeholder="Cognome, nome o codice BOL-…" autocomplete="off" aria-label="Cerca un pass">
          <button type="button" class="btn btn--light" data-azione="pulisci">✕</button>
        </div>
        <ul class="results" data-ruolo="risultati"></ul>
      </div>
      <p class="coda" data-ruolo="coda" hidden></p>
    </section>
  </main>

  <div class="esito" hidden role="alertdialog" aria-live="assertive"></div>

  <script src="js/vendor/jsQR.js?v=202610230519"></script>
  <script src="js/config.js?v=202610230519"></script>
  <script src="js/demo.js?v=202610230519"></script>
  <script src="js/staff.js?v=202610230519"></script>
</body>
</html>
