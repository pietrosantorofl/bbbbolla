  <style>
    .vibes { max-width: 1080px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) var(--gutter) 40px; }
    .vibes__titolo { margin: 0 0 clamp(24px, 4vw, 48px); font-size: clamp(44px, 9vw, 96px); line-height: .92; letter-spacing: -.05em; font-weight: 700; }
    .vibes__vuoto { font-size: 18px; color: var(--muted); }

    /* una serata: data e luogo, poi foto e video a colonne senza buchi (js/vibes.js mette ogni riquadro nella colonna
       più corta e pareggia il fondo con un piccolo ritaglio). Niente CSS columns: Safari spezza i riquadri tra le colonne. */
    .serata-vibes { border-top: 1.5px solid var(--ink); padding: clamp(20px, 3vw, 32px) 0 clamp(36px, 6vw, 72px); scroll-margin-top: 72px; }
    .serata-vibes__data { margin: 0 0 4px; font-size: clamp(28px, 4.5vw, 48px); line-height: 1; letter-spacing: -.03em; font-weight: 700; }
    .serata-vibes__luogo { margin: 0 0 clamp(16px, 3vw, 28px); font-size: 15px; color: var(--muted); }
    .serata-vibes__griglia { display: flex; flex-wrap: wrap; align-items: flex-start; gap: clamp(10px, 2vw, 20px); }
    .serata-vibes__griglia > .vibe--largo { flex: 0 0 100%; }
    .serata-vibes__col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: clamp(10px, 2vw, 20px); }

    .vibe { position: relative; display: block; width: 100%; margin: 0; padding: 0;
      border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; background: #121212; cursor: zoom-in; font: inherit; color: inherit; }
    .vibe img, .vibe video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .vibe:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    /* video: tastino play in basso a destra, si apre con l'audio */
    .vibe__play { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: var(--ink); display: grid; place-items: center; pointer-events: none; }
    .vibe__play svg { width: 14px; height: 14px; fill: var(--paper-2); margin-left: 2px; }
    /* segnaposto: foto o video non ancora arrivati */
    .vibe--attesa { cursor: default; border-style: dashed; background: var(--paper-2); display: grid; place-items: center; }
    .vibe--attesa span { font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; padding: 12px; }

    /* vista grande */
    .vista { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(18, 18, 18, .94); color: var(--paper-2); }
    .vista::backdrop { background: rgba(18, 18, 18, .94); }
    .vista__media { position: absolute; inset: 56px 12px 56px; display: grid; place-items: center; }
    .vista__media img, .vista__media video { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 4px; }
    .vista__btn { position: absolute; width: 44px; height: 44px; border: 1.5px solid var(--paper-2); border-radius: 50%; background: transparent;
      color: var(--paper-2); font: 700 20px/1 var(--font); cursor: pointer; display: grid; place-items: center; }
    .vista__btn:focus-visible { outline: 3px solid var(--paper-2); outline-offset: 3px; }
    .vista__chiudi { top: 8px; right: 12px; }
    .vista__prec { left: 12px; bottom: 8px; }
    .vista__succ { right: 12px; bottom: 8px; }
    .vista__conta { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 14px; pointer-events: none; }
  </style>
