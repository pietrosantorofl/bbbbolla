<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bolla® — live</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="live.css?v=202610241653">
</head>
<body>
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="live">
    <header class="live__top">
      <img class="live__logo" src="../assets/bolla-logo.png" alt="bolla®" width="120" height="40">
      <span class="live__tag" data-t="live">live</span>
    </header>

    <section id="chiuso" class="chiuso" hidden>
      <h1 data-t="chiusoTitolo">Sei fuori dalla bolla</h1>
      <p data-t="chiusoTesto">Questa pagina si apre dal QR proiettato in sala durante la serata.</p>
    </section>

    <form id="modulo" class="modulo" novalidate hidden>
      <h1 class="modulo__titolo" data-t="titolo">Entra nella bolla</h1>
      <p class="modulo__sotto" data-t="sotto">Scegli un nome, un colore e scrivi cosa provi: lo vedrai prendere vita sul muro.</p>

      <div class="sfera" id="sfera" aria-hidden="true">
        <span class="sfera__parola" id="anteprima"></span>
      </div>

      <label class="campo">
        <span data-t="nickname">Nickname</span>
        <input id="nickname" name="nickname" maxlength="16" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
      </label>

      <div class="campo">
        <span data-t="colore">Colore</span>
        <div class="campioni" id="campioni"></div>
        <input id="tinta" class="tinta" type="range" min="0" max="359" value="330" aria-label="Tinta">
      </div>

      <label class="campo">
        <span data-t="emozione">Cosa provi?</span>
        <input id="emozione" name="emozione" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" required>
      </label>

      <p class="errore" id="errore" role="alert" hidden></p>

      <button class="lancia" id="lancia" type="submit" data-t="lancia">Lancia nella bolla</button>
      <p class="nota" id="nota" aria-live="polite"></p>
    </form>
  </main>

  <script src="../js/config.js?v=202610241653"></script>
  <script src="live-api.js?v=202610241653"></script>
  <script src="live.js?v=202610241653"></script>
</body>
</html>
